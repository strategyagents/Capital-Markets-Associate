
services:
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      GRAYLOG_OTLP_EXPORTER_ENDPOINT: ${GRAYLOG_OTLP_EXPORTER_ENDPOINT:-0.0.0.0:4317}
      GRAYLOG_ZIPKIN_ENDPOINT: ${GRAYLOG_ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
    restart: unless-stopped
    depends_on:
      - zipkin
      - graylog

  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:3.3
    ports:
      - "9411:9411"
    restart: unless-stopped

  opensearch:
    container_name: opensearch
    image: opensearchproject/opensearch:2.9.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    restart: unless-stopped

  mongodb:
    container_name: mongodb
    image: mongo:6.0
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  graylog:
    container_name: graylog
    image: graylog/graylog:5.2
    depends_on:
      - mongodb
      - opensearch
    environment:
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:-thisisaverysecurepasswordsecret!}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:-8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918} # default: admin
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_HTTP_EXTERNAL_URI:-http://localhost:9000/}
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
    ports:
      - "9000:9000"        # Graylog UI/API
      - "12201:12201/udp"  # GELF UDP input (enable in Graylog UI)
    restart: unless-stopped

  trader-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trader-agent
    image: trader-agent:latest
    env_file:
      - .env
    environment:
      FASTAPI_PORT: "8080"
      GRAYLOG_OTLP_GRPC_ENDPOINT: otel-collector:4317
    depends_on:
      - otel-collector
    ports:
      - "8080:8080"
    volumes:
      - ./data/sessions:/app/data/sessions
      - ./reference:/app/reference
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo_data:
