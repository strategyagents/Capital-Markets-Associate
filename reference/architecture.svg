    <style>
      text { font-family: Arial, sans-serif; font-size: 14px; fill: #1f2a35; }
      rect, circle { stroke: #2f3b4a; stroke-width: 2; fill: #eef2f7; }
      line { stroke: #2f3b4a; stroke-width: 2; marker-end: url(#arrow); }
